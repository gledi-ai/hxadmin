{% extends "page.html" %}
{% block body %}
<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
  {% for status, count in counts.items() %}
  <a href="{{ admin.url(request, '/stats/' ~ status.value) }}" class="rounded-lg border border-border bg-surface p-4 hover:border-accent">
    <div class="text-sm uppercase tracking-wide text-fg-muted">{{ status.value }}</div>
    <div class="mt-2 text-2xl font-semibold tabular-nums">{{ count }}</div>
  </a>
  {% endfor %}
</div>
{% endblock %}
