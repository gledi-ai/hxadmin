{% extends "page.html" %}
{% block body %}
<p class="mb-4 text-sm text-fg-muted">Status: {{ status.value }} · <a href="{{ admin.url(request, '/stats') }}" class="text-accent hover:underline">Back to statistics</a></p>
<ul class="divide-y divide-edge rounded-lg border border-edge">
  {% for task in tasks %}
  <li class="px-3 py-2 text-sm"><a href="{{ admin.url(request, '/task/' ~ task.id) }}" class="text-accent hover:underline">{{ task.title }}</a></li>
  {% else %}
  <li class="px-3 py-2 text-sm text-fg-muted">No tasks.</li>
  {% endfor %}
</ul>
{% endblock %}
