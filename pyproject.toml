[project]
name = "hxadmin"
dynamic = ["version"]
description = "Admin interface for FastAPI and SQLAlchemy 2.0+, built with Tailwind CSS and htmx"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gledi Caushaj" }]
requires-python = ">=3.13"
keywords = ["fastapi", "sqlalchemy", "admin", "htmx", "tailwind"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.139,<0.143",
  "anyio>=4.10,<5.0",
  "jinja2>=3.1.6,<4.0",
  "pydantic[email]>=2.12,<3.0",
  "python-multipart>=0.0.30,<1.0.0",
  "sqlalchemy[asyncio]>=2.0.45,<3.0",
]

[project.optional-dependencies]
xlsx = ["XlsxWriter>=3.2,<4"]

[dependency-groups]
lint = ["pyrefly~=1.3.0", "ruff~=0.16.0", "zizmor~=1.30"]
test = [
  "aiosqlite~=0.22",
  "httpx2~=2.12",
  "pytest~=9.1",
  "pytest-cov~=7.1",
  "pytest-sugar~=1.1",
  "pytest-xdist~=3.8",
  "xlsxwriter~=3.2",
]
demo = ["aiosqlite~=0.22", "uvicorn~=0.53"]
docs = ["zensical>=0.0.61,<0.1"]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "demo" },
  "ipython~=9.17",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/zensical.toml", "/CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/hxadmin"]

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.uv]
exclude-newer = "1 week"
build-constraint-dependencies = [
  "dunamai==1.26.2",
  "hatchling==1.32.0",
  "jinja2==3.1.6",
  "markupsafe==3.0.3",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.6.1.19",
  "uv-dynamic-versioning==0.14.1",
]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "demo", "demo_tables"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "C4",
  "UP",
  "SIM",
  "RUF",
  "PT",
  "ASYNC",
  "S",
  "TID",
  "PTH",
  "FAST",
  "T20",
  "DTZ",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S314", "S603"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pyrefly]
project-includes = ["src", "tests", "demo", "demo_tables"]
search-path = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

[tool.coverage.run]
source_pkgs = ["hxadmin"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.git-cliff.changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}**breaking:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = "<!-- generated by git-cliff -->"
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^(test|chore|build|ci|style)", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
